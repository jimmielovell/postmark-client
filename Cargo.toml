[package]
name = "postmark-client"
description = "A postmark client in rust"
version = "0.1.0"
edition = "2021"
authors = ["Jimmie Lovell <jimmieomlovell@gmail.com>"]
license = "MIT"
homepage = "https://github.com/jimmielovell/ruts"
keywords = ["postmark", "email", "client", "watfoe"]
categories = ["network-programming"]
repository = "https://github.com/jimmielovell/postmark-client"
readme = "README.md"

[dependencies]
base64 = "0.22.1"
blake3 = "1.8.3"
mime_guess = "2.0.5"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13.1", features = ["json", "query"] }
thiserror = "2.0.17"
tracing = { version = "0.1.44", features = ["log"] }
once_cell = "1.21.3"
regex = "1.12.2"

[dev-dependencies]
claim = "0.5.0"
fake = "4.4.0"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
tokio = { version = "1.49.0", features = ["full"]}
wiremock = "0.6.5"

[[test]]
name = "core"
path = "tests/core.rs"
